name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 检查与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q -x "(build|dist|__pycache__)" .

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 图标资源可重新生成
        run: python build_icons.py

  build:
    name: 打包 exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 打包
        run: python build.py

      - name: 检查产物存在
        run: |
          if (-not (Test-Path dist/ScreenTranslator.exe)) { throw "没有生成 exe" }
          "{0:N1} MB" -f ((Get-Item dist/ScreenTranslator.exe).Length / 1MB)
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator
          path: dist/ScreenTranslator.exe
          if-no-files-found: error
