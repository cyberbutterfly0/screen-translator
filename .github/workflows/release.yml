name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 打包
        run: python build.py

      # 用 runner 自带的 gh，避免再引第三方 action
      - name: 创建 Release 并附上 exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $existing = gh release view $tag --json tagName --jq .tagName 2>$null
          if ($existing) {
            gh release upload $tag dist/ScreenTranslator.exe --clobber
          } else {
            gh release create $tag dist/ScreenTranslator.exe --title "$tag" --generate-notes
          }
